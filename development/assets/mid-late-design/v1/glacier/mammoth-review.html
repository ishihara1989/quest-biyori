<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>氷牙マンモス｜蒼氷の聖域</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#e3edf6;background:#0b1322;font:15px/1.6 "Yu Gothic",Meiryo,sans-serif}main{max-width:1180px;padding:28px 24px 54px;margin:auto}a{color:#91dbe9}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}h1{margin:0;font-size:32px;letter-spacing:.07em}small,.muted{color:#9fbbcf}.eyebrow{color:#8fc6ea;letter-spacing:.15em;margin:0 0 4px;font-size:12px}.links{display:flex;gap:15px;flex-wrap:wrap;font-size:12px}.scene{position:relative;border:1px solid #37556e;border-radius:14px;overflow:hidden;background:#11263c}canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated}.status{position:absolute;top:18px;left:20px;padding:8px 14px;border:1px solid #5577a0;border-radius:6px;background:#0b1639dd;font-size:13px;pointer-events:none}.status b{display:block;color:#c8f5ff;font-size:19px}.bar{height:5px;background:#2a365a;margin-top:6px;overflow:hidden;border-radius:3px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#9162de,#98eeff);width:100%}.controls{display:flex;gap:9px;flex-wrap:wrap;padding:12px 0}button{font:inherit;border:1px solid #45617c;border-radius:6px;background:#192b41;color:#deefff;padding:9px 15px;cursor:pointer}button[aria-pressed="true"]{border-color:#99e2f6;background:#315573}button:hover{background:#29465e}button:focus-visible,a:focus-visible{outline:2px solid #a7e9f7;outline-offset:3px}.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.skill{padding:0;background:#14263b;text-align:left;overflow:hidden;border-radius:9px}.skill img{display:block;width:100%;height:140px;object-fit:contain;image-rendering:pixelated}.skill strong{display:block;padding:0 13px}.skill small{display:block;padding:3px 13px 12px;font-size:11px}.assets{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin:24px 0}.plate{border:1px solid #365069;background:#172840;border-radius:11px;margin:0;padding:16px}.plate img{width:100%;height:320px;object-fit:contain;image-rendering:pixelated}.plate.light{background:#dae4e9;color:#203346}.plate figcaption{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #385773;padding-top:11px}.note{font-size:12px;margin:4px 0 15px;color:#a2bdd1}h2{font-size:20px;margin:25px 0 12px}.plan-links{display:flex;flex-wrap:wrap;gap:20px}footer{border-top:1px solid #283f58;padding-top:17px;margin-top:25px;font-size:12px;color:#a5b9cc}@media(max-width:650px){main{padding:20px 12px}h1{font-size:25px}header{display:block}.links{margin-top:10px}.status{left:9px;top:9px;padding:4px 8px;font-size:10px}.status b{font-size:13px}.skills{grid-template-columns:repeat(2,1fr)}.skill img{height:115px}.assets{grid-template-columns:1fr}.plate img{height:270px}button{padding:7px 10px;font-size:12px}}
</style>
</head>
<body><main>
<header><div><p class="eyebrow">蒼氷の聖域 · Lv.71–80</p><h1>氷牙マンモス</h1></div><div class="links"><a href="../review.html#glacier">氷河の全素材</a><a href="../GLACIER-PLAN.md">氷河企画</a><a href="../DANGER-ACTIONS.md">後半3地域の妨害企画</a></div></header>
<div class="scene"><canvas id="battle" width="1024" height="576" aria-label="氷牙マンモスの危険技と予告範囲の演出プレビュー"></canvas><div class="status" aria-live="polite"><b id="move-name">氷牙大薙ぎ</b><span id="parameters"></span><div class="bar"><span id="remaining"></span></div></div></div>
<div class="controls"><button id="play" aria-pressed="true">一時停止</button><button id="restart">再生し直す</button><button id="interrupt" title="予備動作中の中断演出を確認">中断演出</button><button id="backing" aria-pressed="false">明るい下地</button></div>
<p class="note">演出・範囲のプレビュー。丸印は味方の位置。戦闘AI・被害計算・キャラクターモーションは未実装。</p>
<div class="skills" aria-label="危険技を選択">
<button class="skill" data-action="0" aria-pressed="true" title="予備動作 4.0秒 · 抵抗力 70 · 容量 150 · 半径 300 · 角度 140°"><img src="effects/tusk-sweep.png" alt="氷牙の三日月"><strong>氷牙大薙ぎ</strong><small>4.0秒 · 扇140° · R70 / C150</small></button>
<button class="skill" data-action="1" aria-pressed="false" title="予備動作 4.6秒 · 抵抗力 110 · 容量 180 · 半径 160→330 · 間隔 0.9秒"><img src="effects/ice-quake.png" alt="氷柱の地面衝撃"><strong>氷震踏砕</strong><small>4.6秒 · 二段波 · R110 / C180</small></button>
<button class="skill" data-action="2" aria-pressed="false" title="予備動作 4.8秒 · 抵抗力 20 · 容量 180 · 半径 130 · 3地点 · 間隔 0.8秒"><img src="effects/glacial-boulder.png" alt="尾を引く落下氷塊"><strong>氷塊天落</strong><small>4.8秒 · 三地点 · R20 / C180</small></button>
<button class="skill" data-action="3" aria-pressed="false" title="予備動作 5.4秒 · 抵抗力 85 · 容量 220 · 半径 180→330→450 · 間隔 1.0秒 · HP50%以下"><img src="effects/aurora-crown.png" alt="オーロラと氷冠"><strong>白夜の氷冠</strong><small>5.4秒 · 三段波 · R85 / C220</small></button>
</div>
<h2>基準デザインとレア素材</h2>
<div class="assets"><figure class="plate"><a href="ice-tusk-mammoth.png" target="_blank"><img src="ice-tusk-mammoth.png" alt="白銀の長毛、巨大な蒼氷の牙、背に氷塊を持つ氷牙マンモス"></a><figcaption><b>氷牙マンモス</b><a href="monsters-v3.png">敵7種の一覧</a></figcaption></figure><figure class="plate"><a href="drops/mammoth-ice-tusk.png" target="_blank"><img src="drops/mammoth-ice-tusk.png" alt="象牙色の根元と蒼い氷殻を持つマンモスの氷牙"></a><figcaption><b>マンモスの氷牙</b><small>大ボス30%</small></figcaption></figure></div>
<div class="plan-links"><a href="../GLACIER-PLAN.md">デザイン・行動・モーション座標</a><a href="../DANGER-ACTIONS.md">氷河／火山／魔王城の危険行動</a><a href="PROMPTS.md">今回の生成プロンプト</a><a href="replacement-qa.json">素材検査</a></div>
<footer>静止基準素材／企画の開始値。各技の中断で未発動の攻撃予約を破棄し、休息へ進む。</footer>
</main>
<script>
'use strict';
const canvas=document.getElementById('battle'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const names=['氷牙大薙ぎ','氷震踏砕','氷塊天落','白夜の氷冠'];
const actions=[{prep:4,r:70,c:150,span:.8,rest:3},{prep:4.6,r:110,c:180,span:1.3,rest:3},{prep:4.8,r:20,c:180,span:2,rest:3.5},{prep:5.4,r:85,c:220,span:2.4,rest:4}];
const files=['background.png','ice-tusk-mammoth.png','effects/tusk-sweep.png','effects/ice-quake.png','effects/glacial-boulder.png','effects/aurora-crown.png'];
const imgs=files.map(file=>{const img=new Image();img.src=file;return img;});
const targets=[{x:425,y:390,c:'#ffc78a',label:'戦'},{x:380,y:462,c:'#f9eda8',label:'聖'},{x:282,y:362,c:'#b19aff',label:'魔'},{x:220,y:450,c:'#96deef',label:'忍'},{x:154,y:388,c:'#e998d0',label:'呪'},{x:120,y:490,c:'#ffe9ed',label:'巫'}];
const origin={x:715,y:420},points=[{x:154,y:388},{x:440,y:420},{x:735,y:378}];
let selected=0,time=0,playing=true,cancelled=false,cancelTime=0,previous=performance.now(),lastStatus='';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function reset(index=selected){selected=index;time=0;cancelled=false;lastStatus='';document.getElementById('move-name').textContent=names[index];document.querySelectorAll('.skill').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));}
document.querySelectorAll('.skill').forEach(b=>b.addEventListener('click',()=>{reset(Number(b.dataset.action));draw();}));
document.getElementById('restart').addEventListener('click',()=>{reset();draw();});
document.getElementById('play').addEventListener('click',e=>{playing=!playing;e.target.textContent=playing?'一時停止':'再生';e.target.setAttribute('aria-pressed',String(playing));draw();});
document.getElementById('interrupt').addEventListener('click',()=>{if(time<actions[selected].prep&&!cancelled){cancelled=true;cancelTime=time;draw();}});
document.getElementById('backing').addEventListener('click',e=>{const on=e.target.getAttribute('aria-pressed')!=='true';e.target.setAttribute('aria-pressed',String(on));e.target.textContent=on?'暗い下地':'明るい下地';document.querySelectorAll('.plate').forEach(p=>p.classList.toggle('light',on));});
function sprite(img,x,y,w,h,alpha=1){if(!img.complete||!img.naturalWidth)return;ctx.save();ctx.globalAlpha=alpha;ctx.drawImage(img,x-w/2,y-h/2,w,h);ctx.restore();}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}
function ring(r){circle(origin.x,origin.y,r);ctx.fill();ctx.stroke();}
function sector(){ctx.beginPath();ctx.moveTo(origin.x,origin.y);ctx.arc(origin.x,origin.y,300,Math.PI*110/180,Math.PI*250/180);ctx.closePath();ctx.fill();ctx.stroke();}
function warning(){ctx.save();ctx.beginPath();ctx.rect(0,315,1024,200);ctx.clip();ctx.fillStyle='#986fff16';ctx.strokeStyle='#bc8dff';ctx.lineWidth=3;ctx.setLineDash([12,6]);
 if(selected===0)sector();else if(selected===2)points.forEach((p,i)=>{circle(p.x,p.y,130);ctx.fill();ctx.stroke();ctx.fillStyle='#d2c6ff';ctx.font='bold 20px sans-serif';ctx.fillText('•'.repeat(i+1),p.x-9,p.y);ctx.fillStyle='#986fff16';});else(selected===1?[160,330]:[180,330,450]).forEach(ring);ctx.restore();}
function effect(t){
 if(selected===0){sprite(imgs[2],540,388,450,210,Math.max(0,1-t/.85));return;}
 if(selected===2){points.forEach((p,i)=>{const age=t-i*.8;if(age<-.4||age>.6)return;sprite(imgs[4],p.x,p.y-Math.max(0,-age)*400,270,310,Math.max(0,1-Math.max(0,age)/.6));});return;}
 const radii=selected===1?[160,330]:[180,330,450],gap=selected===1?.9:1;
 radii.forEach((r,i)=>{const age=t-i*gap;if(age<0||age>.65)return;ctx.save();ctx.beginPath();ctx.rect(0,315,1024,200);ctx.clip();ctx.globalAlpha=1-age/.65;ctx.strokeStyle='#c2fbff';ctx.lineWidth=14*(1-age/.65);circle(origin.x,origin.y,r);ctx.stroke();ctx.restore();sprite(imgs[selected===1?3:5],origin.x,origin.y,r*2,150+80*i,(1-age/.65)*.9);});
}
function draw(){const a=actions[selected],cast=time-a.prep,end=cancelled?cancelTime+a.rest:a.prep+a.span+a.rest;ctx.clearRect(0,0,1024,576);if(imgs[0].complete&&imgs[0].naturalWidth)ctx.drawImage(imgs[0],0,0,1024,576);
 const shake=!reduced&&!cancelled&&cast>=0&&cast<.14?Math.sin(time*140)*5:0;ctx.save();ctx.translate(shake,0);
 if(time<a.prep&&!cancelled)warning();
 ctx.fillStyle='#0d1d4680';ctx.beginPath();ctx.ellipse(origin.x,432,85,18,0,0,Math.PI*2);ctx.fill();
 if(!cancelled&&cast>=0&&cast<a.span+.7)effect(cast);
 // The reference's foot baseline is y=1127 on its 1254px canvas.
 // Preserve square sampling and anchor that baseline to the floor.
 sprite(imgs[1],origin.x,432-(1127/1254-.5)*330,330,330);
 targets.forEach(p=>{ctx.fillStyle='#101d31e8';circle(p.x,p.y,18);ctx.fill();ctx.strokeStyle=p.c;ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=p.c;ctx.font='bold 17px sans-serif';ctx.textAlign='center';ctx.fillText(p.label,p.x,p.y+6);});
 if(cancelled&&time-cancelTime<.8){ctx.fillStyle='#b2f9ff';ctx.font='bold 34px "Yu Gothic",sans-serif';ctx.textAlign='center';ctx.fillText('中断',origin.x,185);for(let i=0;i<12;i++){const k=time-cancelTime,angle=i*Math.PI/6;ctx.fillRect(origin.x+Math.cos(angle)*k*130,250+Math.sin(angle)*k*90,5,5);}}
 ctx.restore();ctx.textAlign='left';
 const phase=cancelled?'中断 → 休息':time<a.prep?'予備動作 '+Math.max(0,a.prep-time).toFixed(1)+'秒':cast<a.span?'発動':'休息';
 const status=phase+' · 抵抗 '+a.r+' · 容量 '+a.c;if(status!==lastStatus){document.getElementById('parameters').textContent=status;lastStatus=status;}
 document.getElementById('remaining').style.width=(time<a.prep&&!cancelled?100*(1-time/a.prep):0)+'%';document.getElementById('interrupt').disabled=time>=a.prep||cancelled;
 if(time>end)reset();}
function loop(now){if(playing)time+=Math.min(.05,(now-previous)/1000);previous=now;draw();requestAnimationFrame(loop);}reset();requestAnimationFrame(loop);
</script>
</body></html>
