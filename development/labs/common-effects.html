<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共通画像エフェクトの検収</title><link rel="icon" href="data:,"><script defer src="/js/render/image-effects.js"></script><script defer src="/development/labs/js/common-effects.js"></script>
<style>
body{margin:24px;background:#141a28;color:#edf1fc;font:15px system-ui}h1{font-size:22px}button,input,select{font:inherit}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#141a28;padding:12px;z-index:1}.row{display:grid;grid-template-columns:100px repeat(5,minmax(100px,1fr));align-items:center;gap:8px;margin:14px 0}.row canvas{width:100%;height:auto;background:var(--back,#252e43);image-rendering:pixelated}.row strong{font-size:14px}.scene{max-width:1024px;width:100%;background:var(--back,#252e43);image-rendering:pixelated}body[data-background=light]{--back:#c9cdd4}body[data-background=grid]{--back:#586375}#error{color:#ff9d91}@media(max-width:800px){body{margin:8px}.row{grid-template-columns:70px repeat(5,minmax(38px,1fr));gap:3px}}
</style></head><body><header><h1>共通画像エフェクト</h1><button id="play" disabled>一時停止</button><label>再生速度 <select id="speed"><option value="1">1×</option><option value="0.25">0.25×</option></select></label><label>背景 <select id="background"><option value="dark">暗</option><option value="light">明</option><option value="grid">中間</option></select></label><label>時刻 <input id="time" type="range" min="0" max="559" value="0"></label><output id="clock">0ms</output></header><p>各行：1〜4コマ／連続再生。下段：色替え・光輪・軌跡・連鎖雷・粒子・門。</p><div id="gallery"></div><canvas id="scene" class="scene" width="1024" height="576"></canvas><p id="error" role="alert"></p></body></html>
