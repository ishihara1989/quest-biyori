<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>氷河の素材とモーション</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1629;color:#d5edfa;font:15px system-ui}header{position:sticky;top:0;z-index:2;background:#0b1629ef;padding:18px 5%;display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #335375}h1{font-size:23px;margin:0}h2{font-size:19px}a{color:#a2e7fa}button,select,input{background:#173453;color:#e7f6ff;border:1px solid #4179a6;border-radius:6px;padding:7px}main{max-width:1280px;padding:20px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}article{background:#12253d;border:1px solid #355776;border-radius:12px;padding:14px;overflow:hidden}.viewport{height:300px;background:#182f48 url('/assets/stages/glacial-sanctuary/distant.png') center/cover;display:grid;place-items:center;overflow:hidden}canvas{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated}.controls{display:flex;gap:7px;margin:10px 0;align-items:center;flex-wrap:wrap}.strip{display:flex;overflow-x:auto;gap:4px}.strip img{width:110px;max-height:95px;object-fit:contain;image-rendering:pixelated;background:#0c1930;cursor:pointer}.selected{outline:2px solid #a5efff}.meta{font-size:12px;color:#a6c8dd}.fx .viewport{height:230px}#error{color:#ffb1bf}label{display:flex;align-items:center;gap:5px}.reference{width:75px;height:70px;object-fit:contain;image-rendering:pixelated;float:right}@media(max-width:390px){main{padding:10px}.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>蒼氷の聖域 · Lv.71–80</h1><a href="/game.html">ゲーム</a><button id="pause">⏸</button><label>速度 <select id="speed"><option value="1">1×</option><option value="0.25">¼×</option><option value="2">2×</option></select></label><label><input type="checkbox" id="flip">右向き</label><a href="/development/assets/glacier-motions/PROMPTS.md">生成記録</a></header><main><p id="error"></p><div class="grid" id="enemies"></div><h2>氷のエフェクト</h2><div class="grid fx" id="effects"></div></main><script src="/js/core/motion-playback.js"></script><script>
'use strict';
const state={playing:true,speed:1,flip:false},players=[];
const trotLink=document.createElement('a');trotLink.href='/development/assets/glacier-motions/SINGLE-TROT-PROMPTS.md';trotLink.textContent='歩行の修正記録';document.querySelector('header').append(trotLink);
const json=async url=>{const r=await fetch(url);if(!r.ok)throw Error(url+' '+r.status);return r.json();};
const image=url=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error(url));i.src=url;});
async function load(p,url){p.data=await json(url);p.sheet=await image(new URL(p.data.sheet,new URL(url,location.href)).href);p.url=url;p.time=0;p.manual=null;const parent=new URL(url,location.href);p.strip.replaceChildren(...p.data.frames.map((f,i)=>{const img=document.createElement('img');img.src=new URL(f.file,parent);img.alt=f.phase;img.title=(i+1)+' / '+f.phase;img.onclick=()=>{p.manual=i;state.playing=false;document.querySelector('#pause').textContent='▶';};return img;}));p.meta.textContent=p.data.frameCount+'コマ · '+p.data.durationMs+'ms'+(p.data.loop?' · LOOP':'');}
async function card(label,defs,base,target,reference){const article=document.createElement('article');article.innerHTML='<h2>'+label+'</h2><div class="viewport"><canvas></canvas></div><div class="controls"><select aria-label="モーション"></select><button title="前のコマ">◀</button><button title="次のコマ">▶</button></div><div class="strip"></div><p class="meta"></p>';target.append(article);if(reference){const i=document.createElement('img');i.className='reference';i.src='/development/assets/glacier-motions/references/'+reference+'.png';i.title='基準リファレンス';article.querySelector('h2').append(i);}const p={canvas:article.querySelector('canvas'),strip:article.querySelector('.strip'),meta:article.querySelector('.meta'),time:0};p.ctx=p.canvas.getContext('2d');p.canvas.width=760;p.canvas.height=520;players.push(p);const select=article.querySelector('select');for(const d of defs){const o=document.createElement('option');o.value=d.manifest;o.textContent=d.label;select.append(o);}select.onchange=()=>load(p,base+select.value).catch(fail);const buttons=article.querySelectorAll('button');buttons.forEach((b,i)=>b.onclick=()=>{state.playing=false;p.manual=((p.manual??MotionPlayback.frameAt(p.data,p.time))+(i?1:-1)+p.data.frameCount)%p.data.frameCount;document.querySelector('#pause').textContent='▶';});await load(p,base+defs[0].manifest);}
const fail=e=>document.querySelector('#error').textContent=e.message;
(async()=>{const enemies=await json('/assets/enemies/index.json');for(const e of enemies.filter(e=>e.region==='蒼氷の聖域'))await card(e.label,await json('/'+e.base+e.motionIndex),'/'+e.base+'motions/',document.querySelector('#enemies'),e.id);const effects=await json('/assets/effects/index.json');for(const e of effects.filter(e=>e.id.startsWith('glacier-')))await card(e.label,[{label:e.label,manifest:e.manifest}],'/assets/effects/',document.querySelector('#effects'));})().catch(fail);
let last;function draw(t){const dt=last?t-last:0;last=t;for(const p of players){if(!p.sheet)continue;if(state.playing){p.time+=dt*state.speed;p.manual=null;}const i=p.manual??MotionPlayback.frameAt(p.data,p.data.loop?p.time:p.time% (p.data.durationMs+700)),f=p.data.frames[i],c=p.ctx;c.clearRect(0,0,760,520);c.save();c.imageSmoothingEnabled=false;c.translate(380,430);c.scale(state.flip?-1:1,1);const scale=Math.min(1.25,700/p.data.frameWidth,440/p.data.frameHeight);c.drawImage(p.sheet,f.x,f.y,f.width,f.height,-p.data.pivot.x*scale,-p.data.pivot.y*scale,f.width*scale,f.height*scale);c.restore();p.strip.querySelectorAll('img').forEach((img,j)=>img.classList.toggle('selected',j===i));}requestAnimationFrame(draw);}requestAnimationFrame(draw);
document.querySelector('#pause').onclick=()=>{state.playing=!state.playing;document.querySelector('#pause').textContent=state.playing?'⏸':'▶';};document.querySelector('#speed').onchange=e=>state.speed=Number(e.target.value);document.querySelector('#flip').onchange=e=>state.flip=e.target.checked;
</script></body></html>
