<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>火山・魔王城 初回素材検収</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101018;color:#eeeaf5}*{box-sizing:border-box}body{margin:0;padding:22px}header{display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:23px;margin:0}p{color:#bcb3cc}button,select,input{background:#282332;color:inherit;border:1px solid #635572;border-radius:6px;padding:9px}button{cursor:pointer}button:hover{border-color:#f5b972}a{color:#edbc85}nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,2fr);gap:18px}.panel{background:#1b1724;border:1px solid #3c304b;border-radius:10px;padding:16px}canvas{width:100%;max-width:560px;image-rendering:pixelated;background:#242031}.player{display:flex;justify-content:center;background:repeating-conic-gradient(#252030 0 25%,#2d2738 0 50%) 50% / 24px 24px}.ref{width:100%;height:240px;object-fit:contain;image-rendering:pixelated}.strip{display:flex;overflow:auto;gap:8px}.strip img{width:190px;height:190px;object-fit:contain;image-rendering:pixelated;background:#272030}.strip button{padding:4px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.issues{line-height:1.7;color:#ffc89a}.badge{color:#ffbe71}.sources{font-size:13px;word-break:break-all}#summary{color:#c8b1e9}@media(max-width:700px){body{padding:12px}.grid{grid-template-columns:1fr}.ref{height:180px}}
</style></head><body>
<header><h1>火山・魔王城 初回素材検収</h1><span class="badge">未採用・修正前</span><span id="summary"></span></header>
<p>基準絵と全コマ・再生を比較。倒れた状態は最終コマで停止。原画と課題は保存済み。</p>
<p><a href="/development/labs/demon-god-redesign.html">魔神の修正版 v2：二腕・無面・浮遊 ↗</a></p>
<nav><select id="region"><option value="all">両地域</option><option value="volcano">火山</option><option value="demon-castle">魔王城</option><option value="shared">共通</option></select><select id="asset"></select><button id="previous" title="前の素材">←</button><button id="next" title="次の素材">→</button><button id="refresh" title="保存済みの生成結果を再読込">更新</button><a id="issue-link" href="/development/assets/late-stage-first-pass/v1/ISSUES.md" target="_blank">課題一覧</a></nav>
<div class="grid"><section class="panel"><h2 id="title"></h2><img class="ref" id="reference" alt="固定基準絵"><div id="relations"></div><div class="issues" id="issues"></div><div class="sources" id="sources"></div></section><section class="panel"><div class="player"><canvas id="canvas" width="384" height="384"></canvas></div><div class="controls"><button id="play" title="再生・停止">⏸</button><button id="step" title="1コマ進める">▸|</button><label>速度 <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label><label><input id="flip" type="checkbox">左右反転</label><label><input id="background" type="checkbox">地域背景</label><span id="phase"></span></div><div class="strip" id="frames"></div></section></div>
<script>
'use strict';const base='/development/assets/late-stage-first-pass/v1/',q=s=>document.querySelector(s),ctx=q('#canvas').getContext('2d');ctx.imageSmoothingEnabled=false;let catalog=[],qa=[],filtered=[],current=null,images=[],bg=null,frame=0,playing=true,last=0,elapsed=0,selection=0;
async function refresh(){const [index,result]=await Promise.all([fetch(base+'review-index.json',{cache:'no-store'}).then(r=>r.json()),fetch(base+'qa.json',{cache:'no-store'}).then(r=>r.json())]);catalog=index;qa=result.sources;q('#summary').textContent=catalog.length+' プレビュー / '+qa.filter(x=>x.status!=='not-generated').length+' 原画生成済み';filter();}
function filter(){const region=q('#region').value;filtered=catalog.filter(x=>region==='all'||x.region===region);q('#asset').replaceChildren(...filtered.map(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=(x.enemy?(x.enemyLabel||x.enemy)+' / ':'')+x.label;return o;}));if(filtered.length)select();}
async function select(){const token=++selection;playing=false;const chosen=filtered.find(x=>x.id===q('#asset').value);if(!chosen)return;const manifest=await fetch(base+chosen.manifest).then(r=>r.json());const dir=base+chosen.manifest.slice(0,chosen.manifest.lastIndexOf('/')+1);const loaded=await Promise.all(manifest.frames.map(f=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=dir+f.file;})));if(token!==selection)return;images=loaded;frame=0;elapsed=0;current={...chosen,...manifest};q('#title').textContent=current.label+' / '+(current.enemyLabel||current.enemy||'エフェクト');q('#reference').hidden=!current.reference;if(current.reference)q('#reference').src=new URL(dir+current.reference,location.href).href;q('#relations').textContent=(current.complete?'':'⚠ '+images.length+'/'+current.expectedFrames+'コマのみ。 ')+(current.effects?.length?'対応: '+current.effects.join('、')+' / '+current.repeat+'回':'');const sourceIssues=qa.filter(x=>current.sources.includes(x.source)).flatMap(x=>x.issues);q('#issues').textContent=sourceIssues.length?sourceIssues.join(' ／ '):'生成候補。採用前に解剖・位置・色調・動きの検収が必要。';q('#sources').replaceChildren(...current.sources.map(f=>{const a=document.createElement('a');a.href=base+f;a.target='_blank';a.textContent=f;const p=document.createElement('p');p.append(a);return p;}));q('#frames').replaceChildren(...images.map((im,i)=>{const b=document.createElement('button');b.title=(i+1)+' '+current.phases[i];const thumb=im.cloneNode();b.append(thumb);b.onclick=()=>{playing=false;q('#play').textContent='▶';frame=i;draw();};return b;}));bg=new Image();bg.src='/development/assets/mid-late-design/v1/'+(current.region==='shared'?'volcano':current.region)+'/background.png';playing=true;q('#play').textContent='⏸';draw();}
function draw(){ctx.clearRect(0,0,384,384);if(q('#background').checked&&bg?.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,384,384);ctx.save();if(q('#flip').checked){ctx.translate(384,0);ctx.scale(-1,1);}if(images[frame])ctx.drawImage(images[frame],0,0);ctx.restore();q('#phase').textContent=(frame+1)+' / '+images.length+' '+(current?.phases[frame]||'');}
function tick(now){const dt=last?now-last:0;last=now;if(playing&&current&&images.length){elapsed+=dt*Number(q('#speed').value);if(elapsed>=current.frames[frame].durationMs){elapsed=0;if(frame+1===images.length&&current.terminal){playing=false;q('#play').textContent='▶';}else frame=(frame+1)%images.length;draw();}}requestAnimationFrame(tick);}
q('#region').onchange=filter;q('#asset').onchange=select;q('#refresh').onclick=refresh;q('#next').onclick=()=>{q('#asset').selectedIndex=(q('#asset').selectedIndex+1)%filtered.length;select();};q('#previous').onclick=()=>{q('#asset').selectedIndex=(q('#asset').selectedIndex-1+filtered.length)%filtered.length;select();};q('#play').onclick=()=>{if(current?.terminal&&frame===images.length-1){frame=0;elapsed=0;}playing=!playing;q('#play').textContent=playing?'⏸':'▶';draw();};q('#step').onclick=()=>{playing=false;frame=(frame+1)%images.length;draw();};q('#flip').onchange=draw;q('#background').onchange=draw;refresh().catch(e=>q('#summary').textContent=e.message);requestAnimationFrame(tick);
</script></body></html>
