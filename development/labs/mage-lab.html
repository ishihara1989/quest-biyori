<!doctype html>
<html lang="ja">
<head><base href="/">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>魔法使い — モーション確認</title>
  <link rel="stylesheet" href="/development/labs/css/mage-lab.css">
  <script defer src="/js/core/motion-playback.js"></script><script defer src="/js/skills/mage-motions.js"></script><script defer src="/development/labs/js/mage-lab.js"></script>
</head>
<body><main>
  <header><div><small>SPRITE LAB / MAGE</small><h1>魔法使い</h1></div><nav><a href="/game.html">冒険</a><a href="/development/labs/index.html#mage">コマ一覧</a><a href="/development/labs/effects.html">エフェクト</a></nav></header>
  <div class="motion-grid" id="motions" role="group" aria-label="モーション"></div>
  <section class="preview">
    <canvas id="mage-stage" width="1024" height="576" aria-label="魔法使いの連続動作" role="img"></canvas>
    <p id="status" role="status">素材を読み込んでいます…</p><span id="phase"></span>
  </section>
  <div class="transport">
    <button id="play" title="再生・一時停止（Space）" disabled>Ⅱ</button><button id="previous" title="50ms戻す（←）" disabled>‹</button><button id="next" title="50ms進める（→）" disabled>›</button><button id="restart" title="先頭から再生" disabled>↺</button>
    <label>速度 <select id="speed"><option value=".25">¼×</option><option value=".5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
    <label><input type="checkbox" id="connected" checked>つなげて再生</label><label><input type="checkbox" id="effects" checked>エフェクト</label><label><input type="checkbox" id="flip">左向き</label>
    <output id="time">0ms</output>
  </div>
  <input id="scrub" type="range" min="0" max="3200" step="1" value="0" aria-label="再生位置">
  <div class="sequence" id="sequence"></div>
</main></body></html>
