  <header><a class="brand" href="/game.html">✦ FORESTBOUND</a><nav><a href="/game.html">冒険へ ↗</a><a href="/development/labs/index.html">素材ライブラリ ↗</a></nav></header>
  <main>
    <div class="heading"><div><p>MAGE / SPELL GALLERY</p><h1>魔法使いの魔法</h1></div><span>21 SKILLS <i>◆</i> Lv.1 — 100</span></div>
    <div class="workspace">
      <aside class="catalog"><div class="catalog-head">魔法を選ぶ <small>習得Lv順</small></div><div id="skill-list" aria-label="魔法一覧"></div></aside>
      <section class="review">
        <div class="skill-heading"><img id="skill-art" alt=""><div><p id="skill-unlock"></p><h2 id="skill-name"></h2></div><span id="hit-count"></span></div>
        <div class="options"><label>スキルLv <select id="rank" aria-label="スキルレベル"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label title="専用パッシブのレベル">術式強化 <select id="enhance" aria-label="専用パッシブレベル"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><div class="enemy-toggle" role="group" aria-label="対象"><button data-enemy="mob" aria-pressed="true">雑魚群</button><button data-enemy="boss" aria-pressed="false">ボス</button></div><button id="flip" aria-pressed="false" title="左右反転">↔</button><label class="switch"><input id="effects" type="checkbox" checked>エフェクト</label><label class="switch"><input id="guides" type="checkbox">軌道</label></div>
        <div class="arena"><canvas id="preview" width="1024" height="576" aria-label="魔法使いスキルのモーションプレビュー"></canvas><span id="phase" class="phase">読み込み中</span><div id="skill-banner" class="skill-banner"></div><div id="load-error" role="alert" hidden></div></div>
        <div class="transport"><button id="restart" title="最初から" aria-label="最初から">↺</button><button id="back" title="1コマ戻す · ←" aria-label="1コマ戻す">|◀</button><button id="play" title="再生・停止 · Space" aria-label="再生・停止">❚❚</button><button id="step" title="1コマ進める · →" aria-label="1コマ進める">▶|</button><select id="speed" aria-label="再生速度"><option value=".1">0.1×</option><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><label><input id="loop" type="checkbox" checked> LOOP</label><output id="time">0 ms</output></div>
        <input id="timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="モーションの時間位置">
        <div id="hit-markers" class="hit-markers" aria-label="命中タイミング"></div>
        <div class="details"><p id="skill-note"></p><div><span id="skill-stats"></span><span id="target-rule"></span></div></div>
        <div class="asset-strip"><span>SPRITES / REUSED</span><div id="motion-assets"></div><a id="effect-review" target="_blank">透過・コマ確認 ↗</a></div>
      </section>
    </div>
  </main>
  <footer>ホイール操作は本編のスキルツリーで確認できます。<span>Space 再生・停止　← → コマ送り</span></footer>
