<!doctype html>
<html lang="ja"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マンティコア — trot座標ガイド</title><link rel="stylesheet" href="/development/labs/css/manticore-trot-guide.css"></head>
<body><main>
<header><a class="back" href="/development/labs/highland-motions.html?enemy=manticore&motion=move" title="高原のモーション確認へ">↗</a><div><small>MANTICORE · TROT STUDY</small><h1>4本の脚を、座標で調整。</h1></div><span class="badge" title="V2を採用。①は右後脚の太腿から足への接続だけ修正">V2 採用</span></header>
<div class="toolbar"><button id="play" title="再生・一時停止" aria-label="再生・一時停止">⏸</button><button id="step" title="次のコマ" aria-label="次のコマ">▹│</button><select id="speed" aria-label="再生速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><div id="frames" class="frames" aria-label="コマ選択"></div><button id="overlay" title="改良版に足先の目標座標を重ねる" aria-pressed="true">◎</button><span id="phase">読み込み中…</span></div>
<section class="comparison"><article><h2>V1 <span>保存版</span></h2><canvas id="old" width="490" height="390" aria-label="保存した旧trot"></canvas></article><article><h2>V2 <span>座標ガイドによる生成</span></h2><canvas id="new" width="490" height="390" aria-label="座標ガイドによる改良trot"></canvas></article><article><h2>GUIDE <span>連続軌道</span></h2><canvas id="rig" width="490" height="390" aria-label="4脚の投影ガイド"></canvas></article></section>
<section class="settings"><div class="section-head"><h2>脚ごとの移動量</h2><div><button id="reset" title="標準のガイド設定に戻す">↺</button><button id="export" title="この設定と6コマの座標をJSONで保存">↓ JSON</button></div></div><div id="legs" class="leg-grid"></div></section>
<details><summary>座標・生成記録</summary><div class="measure-tools"><label title="V2の足先の最下点をクリックし、原画座標と目標との差を記録"><input type="checkbox" id="measure">足先を計測</label><select id="measure-leg" aria-label="計測する脚"><option value="LF">左前脚</option><option value="RF">右前脚</option><option value="LH">左後脚</option><option value="RH">右後脚</option></select></div><div id="coordinates"></div><p>スライダーは計算ガイドを変更します。計測値はJSON保存に含めます。</p><a href="/development/assets/highland-motions/trot-v2/guide.json">全座標</a> · <a href="/development/assets/highland-motions/trot-v2/PROMPTS.md">生成指定</a> · <a href="/development/assets/highland-motions/backups/manticore-trot-v1-20261013/backup-info.json">バックアップ</a> · <a href="/development/assets/highland-motions/trot-v2/guides/contact.png">ガイド6コマ</a></details>
</main><script src="/development/labs/js/manticore-trot-model.js"></script><script src="/development/labs/js/manticore-trot-guide.js"></script></body></html>
