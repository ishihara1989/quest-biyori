<!doctype html>
<html lang="ja"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巫女 — 召喚・モーション・演出素材</title><link rel="stylesheet" href="/development/labs/css/miko-asset-lab.css"><script defer src="/js/core/motion-playback.js"></script><script defer src="/development/labs/js/miko-asset-lab.js"></script></head>
<body><main><header><div><small>MIKO / ASSET LAB</small><h1>巫女の霊たち</h1></div><nav><a href="/game.html">冒険</a><a href="/development/labs/ritual-lab.html#miko">祈り</a><a href="assets/skills/miko/catalog.json">素材一覧</a></nav></header>
<section class="toolbar"><select id="mode" aria-label="表示する素材"><option value="scene">スキル演出</option><option value="summon">召喚個体</option><option value="guardian">大型守護霊</option><option value="possession">憑依霊</option><option value="effect">エフェクト</option><option value="miko">巫女モーション</option></select><select id="selection" aria-label="霊・スキルを選択"></select><select id="phase" aria-label="モーションを選択"></select><select id="background" aria-label="背景"><option value="dark">暗い戦場</option><option value="light">明るい戦場</option><option value="alpha">透過</option></select><label title="6人・召喚9体・敵多数を表示"><input id="crowd" type="checkbox">大規模戦</label><label title="他職の大型エフェクトを重ねる"><input id="other-fx" type="checkbox">他職演出</label><label><input id="flip" type="checkbox">左向き</label></section>
