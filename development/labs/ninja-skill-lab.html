  <header><a href="/game.html">← 本編</a><span>NINJA / SHADOW ARTS</span><a href="/development/labs/index.html#ninja">素材一覧 ↗</a></header>
  <main>
    <aside><img class="portrait" src="assets/ninja/idle-01.png" alt="忍者"><h1>忍者</h1><div id="skills" aria-label="スキルを選択"></div></aside>
    <section class="stage-panel">
      <div class="heading"><h2 id="skill-name">手裏剣</h2><label>RANK <select id="rank" aria-label="スキルランク"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>専用強化 <select id="enhance" aria-label="専用強化ランク"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label></div>
      <div class="arena"><canvas id="preview" width="1024" height="576" aria-label="忍者の戦闘モーション"></canvas><div id="status-tip" hidden></div></div>
      <div class="transport"><button id="play" disabled aria-label="再生・一時停止">▶</button><button id="previous" title="1コマ戻る">‹</button><button id="next" title="1コマ進む">›</button><button id="restart" title="最初から">↺</button><input id="timeline" type="range" min="0" max="6000" value="0" step="16.666667" aria-label="再生位置"><output id="clock">0.00s</output></div>
      <div class="controls"><label>速度 <select id="speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label>攻撃速度 <select id="attack-speed"><option value="1">1×</option><option value="2">2×</option><option value="10">10×</option></select></label><button id="flip" aria-pressed="false" title="向きを反転">↔</button><label><input id="effects" type="checkbox" checked>エフェクト</label><label><input id="pivots" type="checkbox">接地位置</label></div>
      <div class="controls"><label>対象 <select id="enemy"><option value="ground">地上</option><option value="flying">飛行</option><option value="mixed">地上＋飛行</option><option value="boss">ボス</option><option value="parts">部位付きボス</option></select></label><label>配置 <select id="formation"><option value="one">1体</option><option value="packed">5体・密集</option><option value="spread">5体・分散</option></select></label><label><input id="rooted" type="checkbox">移動停止</label><label><input id="no-mp" type="checkbox">MP 0</label></div>
      <p id="skill-stats" class="parameters"></p><div class="metrics"><span>Hit <b id="hit-count">0</b></span><span>DMG <b id="damage">0</b></span><span>MP <b id="mp">140</b></span><span>影 <b id="clones">0</b></span></div>
    </section>
  </main>
