<body><header><div><p class="eyebrow">REINCARNATION GODDESS · ARSENAL REVIEW</p><h1>転生の女神 <span>SF兵器5種 ＋ 大型トラック</span></h1></div><a href="/development/labs/reincarnation-goddess.html">基本モーション ↗</a></header>
<nav aria-label="再生設定"><button id="play">停止</button><button id="restart" title="接続と単体の再生を最初から">↺ 最初から</button><label>速度 <select id="speed"><option value="1">通常</option><option value="0.25">低速 ×0.25</option></select></label><label>背景 <select id="background"><option value="dark">暗色</option><option value="light">明色</option><option value="checker">市松</option></select></label><label><input id="ranges" type="checkbox" checked>範囲予告</label><span id="status" role="status">読み込み中…</span></nav>
<main><section class="sequence-panel"><div class="section-heading"><h2>接続プレビュー</h2><select id="scene" aria-label="攻撃と帰還"><option value="pulse">扇 · パルス散弾機関砲</option><option value="laser">線 · 陽電子レール砲</option><option value="missiles">小円 · 追尾ミサイル配送</option><option value="discs">弧 · 重力ブーメラン</option><option value="orbital">大円 · 衛星スタンプ砲</option><option value="truck-rush" selected>大技 · トラック突進</option><option value="truck-cancel">大技 · 妨害で涙目</option><option value="return">帰還 · ゲートへ</option></select><output id="phase"></output></div><canvas id="stage" width="1280" height="720" aria-label="攻撃範囲とモーションとエフェクトの接続"></canvas><div class="timeline"><input id="timeline" aria-label="接続の時刻" type="range" min="0" max="6500" step="10" value="0"><output id="time">0 ms</output></div><p id="parameters"></p></section>
<section class="single-panel"><div class="section-heading"><h2>単体・コマ確認</h2><select id="clip" aria-label="素材クリップ"></select><button id="step" title="次のコマへ。再生を停止する">次のコマ →</button><output id="counter"></output></div><div class="single-content"><canvas id="clip-canvas" width="512" height="512" aria-label="選択素材の単体再生"></canvas><div id="contact" class="contact"></div></div></section>
