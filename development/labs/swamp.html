<!doctype html>
<html lang="ja">
<head><base href="/">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101a19"><title>毒の沼地 — 敵キャラ</title>
  <link rel="stylesheet" href="/development/labs/css/swamp-battle.css">
  <script defer src="/js/core/motion-playback.js"></script><script defer src="/js/combat/status-resistance.js"></script>
  <script defer src="/js/combat/swamp-combat.js"></script><script defer src="/development/labs/js/swamp-battle.js"></script>
</head>
<body>
  <main class="shell">
    <header><a href="./">✦ IDLE RPG</a><nav><a href="/development/labs/stages.html?stage=poison-swamp">背景</a><a href="/development/labs/enemies.html#giga-toad">モーション</a><a href="/development/labs/effects.html">エフェクト</a></nav></header>
    <section class="heading"><div><p>POISON SWAMP</p><h1>毒の沼地</h1></div><span class="region-mark">☣</span></section>
    <div id="enemy-tabs" class="enemy-tabs" role="group" aria-label="敵キャラ"></div>
    <section class="arena-panel" aria-label="戦闘プレビュー">
      <div class="arena-header"><div><span id="rank"></span><h2 id="enemy-name">ギガトード</h2></div><span id="motion-label" role="status">準備中</span></div>
      <div class="arena"><canvas id="battle" width="1024" height="576" role="img" aria-label="毒の沼地の戦闘。地面をクリックして戦士を移動" tabindex="0" title="地面をクリックして移動。方向キーでも移動できます。"></canvas><span id="load-status" role="status">素材を読み込んでいます…</span><div id="status-icons" aria-live="polite"></div></div>
      <div class="health-row"><label title="戦士のHP"><span>⚔</span><progress id="hero-health" max="2000" value="2000"></progress></label><label title="敵のHP"><span>☣</span><progress id="enemy-health" max="100" value="100"></progress></label></div>
      <div class="controls"><button id="play" type="button" disabled title="再生 / 一時停止">Ⅱ</button><button id="reset" type="button" disabled title="戦闘を最初から">↺</button><button id="attack-normal" type="button" disabled>攻撃Ⅰ</button><button id="attack-special" type="button" disabled>攻撃Ⅱ</button><button id="hit" type="button" disabled title="被弾モーションを確認">被弾</button><button id="down" type="button" disabled title="撃破モーションを確認">撃破</button><label title="戦士も自動で戦う"><input id="hero-auto" type="checkbox">⚔ AUTO</label><label title="戦闘終了後に同じ敵でもう一度"><input id="repeat" type="checkbox" checked>↻</label></div>
    </section>
    <footer><a id="motion-link" href="/development/labs/enemies.html#giga-toad">コマ送り・素材の保存 ↗</a><span>07 ENEMIES / POISON SWAMP</span></footer>
  </main>
</body>
</html>
