<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>試練の乱入者 — 左向き待機</title>
  <link rel="stylesheet" href="/development/labs/css/trial-intruder-idles.css">
  <script defer src="/development/labs/js/trial-intruder-idles.js"></script>
</head>
<body data-background="dark">
  <main>
    <header><a href="/development/labs/index.html">← 素材検収</a><p class="eyebrow">TRIAL INTRUDERS</p><h1>試練の乱入者</h1><p id="status" role="status">待機ループを読み込み中…</p></header>
    <div class="toolbar" aria-label="再生設定">
      <button id="play" type="button">すべて停止</button><button id="restart" type="button" title="先頭に戻る">↺ 先頭</button>
      <label>速度 <select id="speed"><option value="1">通常</option><option value="0.35">低速 ×0.35</option></select></label>
      <label>背景 <select id="background"><option value="dark">暗色</option><option value="light">明色</option><option value="checker">市松</option></select></label>
      <label><input id="guides" type="checkbox"> 基準線</label>
    </div>
    <section class="inspector" aria-labelledby="selected-name">
      <div class="selected-heading"><div><p class="eyebrow" id="selected-region"></p><h2 id="selected-name">外宇宙の女神</h2></div><a id="gif" href="/development/assets/trial-intruders/idle-v1/review/outer-space-goddess-idle.gif">GIF ↗</a></div>
      <div class="feature"><canvas id="selected" width="512" height="512" aria-label="選択した敵の待機ループ"></canvas><div id="eye-panel"><h3>目元</h3><canvas id="eye" width="264" height="240" aria-label="女神の淡い発光する瞳"></canvas><p>転生の女神の後</p></div></div>
      <div class="steps"><button id="previous" type="button" aria-label="前のコマ">←</button><output id="counter" aria-live="off"></output><button id="next" type="button" aria-label="次のコマ">→</button></div>
      <div id="selected-frames" class="frames" aria-label="選択した敵の全コマ"></div>
    </section>
    <section aria-labelledby="gallery-title"><div class="section-heading"><h2 id="gallery-title">左向き待機 · 11体</h2><span>選択して拡大</span></div><div id="gallery" class="gallery"></div></section>
    <details id="all-frames"><summary>全43コマ</summary><div id="all-frame-groups"></div></details>
  </main>
</body>
</html>
