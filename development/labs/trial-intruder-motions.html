<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>試練追加敵・モーション素材検収</title><link rel="stylesheet" href="/development/labs/css/trial-intruder-motions.css"></head>
<body><header><div><a href="/development/labs/trial-intruder-idles.html">待機 ↗</a><h1>試練追加敵 <small>モーション・FX</small></h1><p id="progress">素材を読み込み中</p></div><span class="badge">制作候補 / 本編未登録</span></header>
<main><nav aria-label="素材選択"><label>対象<select id="enemy"></select></label><label>種別<select id="kind"><option value="body">本体</option><option value="effect">FX</option></select></label><label>素材<select id="clip"></select></label><label>表示<select id="mode"><option value="single">単体</option><option value="composition">画像FX合成</option><option value="idle">待機との接続</option><option value="comparison">大ボスと縮尺比較</option><option value="all">対象の一覧再生</option></select></label><button id="combo" title="女神の踏み込み→二連斬り→制動→射撃を本体と画像FXで再生">女神の接続 ▶</button></nav>
<section class="stage-wrap"><canvas id="stage" width="1024" height="576" aria-label="選択素材の連続再生"></canvas><div class="stage-caption"><strong id="title"></strong><span id="frame"></span></div></section>
<section class="controls" aria-label="再生操作"><button id="play" title="停止または再開">⏸</button><button id="first" title="先頭に戻る">⏮</button><button id="prev" title="前のコマ">◀</button><button id="next" title="次のコマ">▶</button><label>速度<select id="speed"><option value="1">1×</option><option value="0.35">0.35×</option><option value="0.1">0.1×</option></select></label><label>背景<select id="background"><option value="dark">暗色</option><option value="light">明色</option><option value="checker">市松</option></select></label><label><input id="fx" type="checkbox" checked>画像FX</label><label><input id="anchors" type="checkbox">実測アンカー</label></section>
<p class="note" id="note"></p><section id="frames" aria-label="選択素材の全コマ"></section><details><summary>制作状況</summary><div id="inventory"></div></details></main>
<script type="module" src="/development/labs/js/trial-intruder-motions.js"></script></body></html>
