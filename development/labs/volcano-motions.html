<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>火山のモーション検収</title><link rel="stylesheet" href="/development/labs/css/volcano-motions.css"></head>
<body><header><h1>火山 <small>モーション検収</small></h1><nav><a href="/development/labs/late-stage-first-pass.html">一次素材</a><a href="/development/assets/volcano-motions/v2/PROMPTS.md">生成指定</a><a href="/development/assets/volcano-motions/v2/qa.json">検収記録</a></nav></header>
<main><aside><select id="subject" aria-label="対象素材"></select><img id="reference" alt="固定基準絵"><div id="motions" aria-label="モーション"></div><p id="summary" role="status">読込中</p></aside><section><div class="stage"><canvas id="canvas" width="1024" height="576" aria-label="火山背景でのモーションとエフェクト"></canvas></div>
<div class="controls"><button id="previous" title="前のコマ" aria-label="前のコマ">|◀</button><button id="play" title="再生・停止" aria-label="再生・停止">⏸</button><button id="next" title="次のコマ" aria-label="次のコマ">▶|</button><button id="replay" title="最初から再生" aria-label="最初から再生">↻</button><select id="speed" aria-label="再生速度"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select><label><input id="loop" type="checkbox">ループ</label><label><input id="background" type="checkbox" checked>背景</label><label><input id="effects" type="checkbox" checked>演出</label><label><input id="flip" type="checkbox">反転</label><select id="zoom" aria-label="表示倍率"><option value="1">検収サイズ</option><option value="0.55">戦闘サイズ</option></select><span id="phase"></span></div>
<div class="controls"><label title="待機から動作、復帰まで再生"><input id="bridge" type="checkbox">状態切替</label><button id="interrupt" title="現在の予備動作を中断して被弾から待機へ">✦ 中断</button><button id="defeat" title="現在の動作から撃破へ切り替えて終端を保持">☓ 撃破</button></div>
<div id="frames" aria-label="全コマ"></div><div id="links"></div><p id="error" role="alert"></p></section></main><script src="/js/core/motion-playback.js"></script><script src="/development/labs/js/volcano-motions.js"></script></body></html>
